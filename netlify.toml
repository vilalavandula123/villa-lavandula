# Настройки за Netlify. Netlify разпознава Next.js и сам добавя адаптера си (OpenNext).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Публичен адрес за canonical/sitemap. Сменете го при собствен домейн.
  SITE_URL = "https://extraordinary-gingersnap-bb3f61.netlify.app"
  # Търсачките НЕ индексират сайта, докато не стане "true" (при окончателно публикуване).
  SITE_INDEXABLE = "false"
  # SMTP_* / MAIL_FROM / ENQUIRY_TO НЕ се пишат тук (тайни) — задават се в Netlify:
  # Project configuration → Environment variables. Виж .env.example.

# Адаптерът на Netlify за Next.js (сървърни страници, формата, оптимизация на снимки).
[[plugins]]
  package = "@netlify/plugin-nextjs"
